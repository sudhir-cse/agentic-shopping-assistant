[project]
name = "shopping-assistant-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.57.0",
    "groq>=1.0.0",
    "ipykernel>=7.1.0",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.2",
]

[tool.uv.workspace]
members = ["apps/api", "apps/chatbot_ui", "apps/items_mcp_server", "apps/reviews_mcp_server"]

[dependency-groups]
dev = [
    "cohere>=7.0.4",
    "instructor>=1.15.3",
    "langchain-community>=0.4.0,<0.4.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-openai>=1.1.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph>=1.2.2",
    "langsmith>=0.8.16",
    "matplotlib>=3.11.0",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "fastmcp>=3.4.4",
    "langchain-mcp-adapters>=0.3.0",
    "tavily-python>=0.7.26",
    "psycopg2-binary>=2.9.12",
    "litellm>=1.94.1",
    "langchain-litellm>=0.7.0",
    "google-adk>=2.3.0",
    "a2a-sdk>=1.1.2",
    "guardrails-ai>=0.10.2",
]
